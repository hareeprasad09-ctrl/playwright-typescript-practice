<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Lab</title>
  <style>
    body { font: 18px system-ui; max-width: 680px; margin: 60px auto; padding: 24px; background: #f4f7fb; color: #14213d; }
    main { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 8px 32px #14213d14; }
    input, button { font: inherit; padding: 10px; margin: 4px; }
    button { cursor: pointer; }
    li { display: flex; gap: 12px; align-items: center; margin: 16px 0; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li[data-completed="true"] span { text-decoration: line-through; }
    [aria-pressed="true"] { background: #14213d; color: white; }
    [role="alert"] { color: #a31224; }
  </style>
</head>
<body><main>
  <h1>Task Lab</h1>
  <p>A small space to practice reliable browser tests.</p>
  <form id="task-form" novalidate>
    <label for="task-input">New task</label>
    <input id="task-input" autocomplete="off">
    <button type="submit">Add task</button>
  </form>
  <p role="alert" id="error" hidden></p>
  <nav aria-label="Task filters">
    <button type="button" data-filter="All" aria-pressed="true">All</button>
    <button type="button" data-filter="Active" aria-pressed="false">Active</button>
    <button type="button" data-filter="Completed" aria-pressed="false">Completed</button>
  </nav>
  <ul aria-label="Tasks" id="tasks"></ul>
  <p id="empty">No tasks to show.</p>
  <p role="status" id="count"></p>
  <button id="clear" type="button">Clear completed</button>
</main><script src="/app.js"></script></body>
</html>
